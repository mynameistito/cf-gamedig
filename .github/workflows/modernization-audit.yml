name: Modernization Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - issue-44-modernize-toolchain

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Clean frozen install
        run: bun install --frozen-lockfile

      - name: Direct dependency audit
        run: bun outdated

      - name: TypeScript dependency graph
        run: |
          bun pm why typescript
          bun pm why typescript-eslint
          bun pm why @typescript-eslint/parser
          bun pm why eslint-plugin-github
          bun pm why eslint-plugin-sonarjs

      - name: Baseline typecheck
        run: bun run typecheck

      - name: Baseline checks
        run: |
          bun check
          bun run check

      - name: Baseline tests
        run: bun test

      - name: Baseline coverage
        run: bun run test:coverage
