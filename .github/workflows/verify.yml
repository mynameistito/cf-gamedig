name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Show formatter diff
        run: |
          bunx oxfmt src/container/server.ts test/request-security.test.ts
          git diff -- src/container/server.ts test/request-security.test.ts

      - name: Check
        run: bun run check

      - name: Test
        run: bun test

      - name: Build Docker image
        run: docker build .
