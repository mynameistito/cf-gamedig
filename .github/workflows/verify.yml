name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check Bun script shorthand
        run: bun check

      - name: Check explicit Bun script
        run: bun run check

      - name: Test
        run: bun test

      - name: Coverage
        run: bun run test:coverage

      - name: Verify formatter stability
        run: |
          bun run fix
          git diff --exit-code
          bun run fix
          git diff --exit-code

      - name: Build Docker image
        run: docker build .

      - name: Docker E2E
        timeout-minutes: 5
        run: bun run test:e2e

  windows:
    name: Verify (Windows / PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check Bun script shorthand
        run: bun check

      - name: Check explicit Bun script
        run: bun run check

      - name: Test
        run: bun test

      - name: Coverage
        run: bun run test:coverage

      - name: Verify formatter stability
        shell: pwsh
        run: |
          bun run fix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run fix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
