name: Modernization Generate

on:
  push:
    branches:
      - issue-44-modernize-toolchain

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update Cloudflare Workers types
        run: bun add --dev --exact @cloudflare/workers-types@5.20260820.1

      - name: Apply canonical formatting
        run: bun run fix

      - name: Validate generated state
        run: |
          bun run typecheck
          bun check
          bun run check
          git diff --check

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Cloudflare Workers types"
          git push origin HEAD:issue-44-modernize-toolchain
