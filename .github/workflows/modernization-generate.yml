name: Modernization Generate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - issue-44-modernize-toolchain

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update Cloudflare Workers types
        run: bun add --dev --exact @cloudflare/workers-types@5.20260820.1

      - name: Apply canonical formatting
        run: bun run fix

      - name: Validate generated state
        run: |
          bun run typecheck
          bun check
          bun run check
          git diff --check
          git diff --name-only
          git diff > modernization.diff

      - name: Upload generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modernization-generated
          path: |
            package.json
            bun.lock
            modernization.diff
          if-no-files-found: error
